<script>
(function(){
  // default = play: opening the file starts the music, the animation and the meter.
  // add ?render for a single deterministic frame.
  var play = !new URLSearchParams(location.search).has("render");
  window.WEM_AB_GAIN = 0.88;
  window.WEM_AB_EXPO = 0.30;
  window.WEM_AB_MUL = 1.62;
  window.WEM_BANDS_GAIN = 0.22;
  window.WEM.boot({ mode: play ? "play" : "render" }).then(function(){
    window.__booted = true;
    if (!play) { document.getElementById("start").style.display = "none"; }
    document.addEventListener("keydown", function(e){
      if (e.key === "p" || e.key === "P") {
        document.getElementById("start").style.display = "block";
        window.WEM.app.audio && window.WEM.app.audio.play();
      }
    });
  }).catch(function(e){
    window.__bootError = String(e && e.stack || e);
    console.error(e);
  });
})();
</script>
