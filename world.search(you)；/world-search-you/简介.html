  .hint{

    border-top:1px solid var(--line);padding:7px 16px;color:var(--dim);font-size:11.5px;

<script>

/* ==========================================================================
   ↑↑↑  要改的字全在上面  ↑↑↑
   ========================================================================== */

const $ = (id) => document.getElementById(id);

function paint() {
  $("titles").textContent = TEXT.titles;
  $("full").textContent = TEXT.full;
  $("short").textContent = TEXT.short;
  $("tags").innerHTML = TEXT.tags.map((t) => "<span>" + t + "</span>").join("");
}
paint();

// copy buttons
document.querySelectorAll("[data-copy]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const el = $(btn.dataset.copy);
    const txt = el.textContent;
    const done = () => { const o = btn.textContent; btn.textContent = "已复制 ✓";
      setTimeout(() => { btn.textContent = o; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done);
    else { const ta = document.createElement("textarea"); ta.value = txt;
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      ta.remove(); done(); }
  });
});

// edit mode: change the words right on the page, then copy
let editing = false;
$("editBtn").addEventListener("click", () => {
  editing = !editing;
  $("editBtn").classList.toggle("on", editing);
  $("editBtn").textContent = editing ? "退出编辑" : "编辑模式";
  ["titles", "full", "short"].forEach((id) => {
    const el = $(id);
    el.contentEditable = editing ? "true" : "false";
    el.classList.toggle("edit", editing);
  });
  if (!editing) {           // write the edits back into TEXT so a copy keeps them
    TEXT.titles = $("titles").textContent;
    TEXT.full = $("full").textContent;
    TEXT.short = $("short").textContent;
  }
});
</script>
